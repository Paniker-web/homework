<!DOCTYPE html>
<html class="page" lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/index.css">
	<link rel="shortcut icon" href="./icons/pulse-favicon-48x48.ico" type="image/x-icon">
	<title>Pulse Fitness Center</title>
</head>
<body class="page__body">
<header class="header">
	<div class="container header__container">
		<a class="logo header__logo" href="#">
			<img
				class="logo__img"
				src="./icons/logo-icon.svg"
				width="198"
				height="38"
				alt="Логотип Nike"
			/>
		</a>
		<nav
			class="menu header__menu"
			id="header__menu"
			aria-label="Главное меню"
		>
		<ul class="menu__list">
			<li class="menu__item">
				<a class="menu__link" href="#HOME" lang="en">HOME</a>
			</li>
			<li class="menu__item">
				<a class="menu__link" href="#CATALOGS">CATALOGS</a>
			</li>
			<li class="menu__item">
				<a class="menu__link" href="#BLOG">BLOG</a>
			</li>
			<li class="menu__item">
				<a class="menu__link" href="#COLLECTIONS">COLLECTIONS</a>
			</li>
			<li class="menu__item">
				<a class="menu__link" href="#CONTACT US">CONTACT US</a>
			</li>
		</ul>
		</nav>
		<div class="header__controls">
				<button
					class="header__actions-button"
					title="Корзина"
					aria-label="Корзина"
				>
					<svg width="38" height="26">
						<use
							class="header__actions-icon"
							href="./icons/sprite.svg#cart"
						></use>
					</svg>
				</button>
				<button
					class="header__actions-button"
					title="Поиск"
					aria-label="Поиск"
				>
				<svg width="29" height="29">
					<use
						class="header__actions-icon"
						href="./icons/sprite.svg#search"
					></use>
				</svg>
			</div>
	</div>
</header>
<main>
	
</main>
</body>
</html>
